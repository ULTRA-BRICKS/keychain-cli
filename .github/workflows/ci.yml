name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'ruff==0.16.10'
      - run: ruff check .

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tomllib (policy file) is stdlib on 3.11+, so 3.11 is the floor.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # Fake backend + fake `security` (macOS) + D-Bus marshalling. The live Secret Service
      # tests skip here (KEYCHAIN_LIVE unset): the runner has no session bus or keyring.
      - run: python -m pytest -q

  secret-scan:
    name: gitleaks (block on secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        # The CLI directly, checksum-verified: the gitleaks Action needs a paid license for
        # organization repos and misdetects Forgejo owners (see task-cli's ci.yml).
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --no-banner --redact
